# Standalone Cloud Run deployment workflow template for operator environments

name: Deploy to Google Cloud Run

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: true
        default: "latest"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: promptiq-backend
          image: gcr.io/${{ secrets.GCP_PROJECT_ID }}/promptiq-backend:${{ github.event.inputs.image_tag }}
          region: us-central1
          flags: "--allow-unauthenticated --min-instances=0 --max-instances=5"
