# Fly.io production configuration for PromptIQ Backend
app = "promptiq-intelligence-api"
primary_region = "sin"

[build]
  dockerfile = "deployment/docker/Dockerfile"

[env]
  PROMPTIQ_ENV = "production"
  PROMPTIQ_ZERO_PRICE_ENFORCEMENT = "true"
  PROMPTIQ_API_HOST = "0.0.0.0"
  PROMPTIQ_API_PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"
